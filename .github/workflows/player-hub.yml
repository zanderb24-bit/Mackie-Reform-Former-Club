name: Test, build and launch Player Hub

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Launch the tested site on GitHub Pages (main branch only)
        required: true
        type: boolean
        default: true
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build static site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked test dependencies
        run: npm ci
      - name: Test database permissions and application utilities
        run: npm test
      - name: Build deployable HTML site
        run: npm run build
      - name: Select runner Chrome
        shell: bash
        run: |
          chrome_path="$(command -v google-chrome)"
          "$chrome_path" --version
          printf 'CHROMIUM_PATH=%s\n' "$chrome_path" >> "$GITHUB_ENV"
      - name: Test the built site in Chromium
        run: npm run test:browser -- --reporter=list,html
        env:
          SITE_DIRECTORY: _site
          PLAYWRIGHT_HTML_OPEN: never
      - name: Save browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save downloadable site
        uses: actions/upload-artifact@v4
        with:
          name: mackie-player-hub-site
          path: _site/
          include-hidden-files: true
          retention-days: 14
      - name: Prepare Pages deployment
        if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  launch:
    name: Launch on GitHub Pages
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@v5
      - name: Deploy tested site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Show site link
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "## Player Hub is live" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open Mackie Rugby Player Hub]($SITE_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "Use Explore the demo until Supabase is configured." >> "$GITHUB_STEP_SUMMARY"
